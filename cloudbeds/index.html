<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Connect Cloudbeds</title>
<style>body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#000;color:#fff;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
main{width:min(460px,100%);display:grid;gap:14px}img{width:160px;margin:0 auto 10px;display:block}
input{font:600 16px ui-monospace,monospace;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;width:100%;box-sizing:border-box}
button{font:700 17px -apple-system,system-ui,sans-serif;padding:14px;border-radius:999px;border:0;background:#fff;color:#000}
p{color:#aaa;font-size:14px;margin:0}</style></head><body><main>
<img src="/img/onyx-logo-white.png" alt="Onyx Beach Hotel">
<p>1. In Cloudbeds → Marketplace → API Credentials, copy the <b>Client ID</b> of "Onyx OS" (starts with <code>livel_</code>).</p>
<input id="cid" placeholder="Paste Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="go">2. Approve in Cloudbeds</button>
<p>3. Approve. You'll come back to onyxbeachhotel.com with a black box showing a code. Copy it and send it to Claude.</p>
</main>
<script>document.getElementById('go').onclick=function(){var id=document.getElementById('cid').value.trim();if(!id){alert('Paste the Client ID first');return}
location.href='https://hotels.cloudbeds.com/api/v1.2/oauth?client_id='+encodeURIComponent(id)+'&redirect_uri='+encodeURIComponent('https://onyxbeachhotel.com')+'&response_type=code'};</script>
</body></html>
