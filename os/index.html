<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Onyx OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onyx">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>

/* Layout: iPad command center. Sidebar of sections (landscape), bottom tab bar (portrait/phone); each section is a stack of panels, summary first. */
:root{
  /* single black theme to match the Onyx logo */
  --bg:#000000; --panel:#0f0f10; --sunk:#1a1b1c; --line:#26282a; --ink:#f2f2f0; --muted:#9a9c9e;
  --accent:#4fb898; --accent-ink:#04110d; --accent-soft:#12322a;
  --good:#5cc489; --warn:#e3a74a; --bad:#f07a70; --good-soft:#123222; --warn-soft:#352812; --bad-soft:#3a1714;
  --ch-direct:#4fb898; --ch-bcom:#6f9cf0; --ch-airbnb:#f07a8a; --ch-agoda:#ae8cf0; --ch-expedia:#e3bf4a; --ch-other:#93a39c;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font:700 22px/1 var(--display);letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.mark{width:38px;height:38px;border-radius:10px;display:block;flex:none;border:1px solid var(--line)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;min-height:44px}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.navbtn[aria-current="page"] svg{color:var(--accent)}
.navbtn .cnt{margin-left:auto;font-size:12px;background:var(--bad);color:#1a0705;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:22px 110px;padding-inline:clamp(16px,3vw,32px)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:18px}
.top h1{font:700 clamp(26px,3.4vw,34px)/1.1 var(--display);margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:14px}
.top .spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0002}
select.inp,input.inp,textarea.inp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
textarea.inp{min-height:72px;resize:vertical}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:42px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font:700 18px/1.2 var(--display);margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-height:92px;display:flex;flex-direction:column;gap:3px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font:700 22px/1.15 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.nodata .v{color:var(--muted);font-size:15px;font-family:var(--body);font-weight:600}
.kpi .f{display:none;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.kpi[aria-expanded="true"] .f{display:block}
.alerts{display:grid;gap:10px}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden}
.alert .stripe{align-self:stretch;border-radius:0 4px 4px 0}
.sev-high .stripe{background:var(--bad)} .sev-med .stripe{background:var(--warn)} .sev-low .stripe{background:var(--good)}
.alert .t{font-weight:700}
.alert .why{color:var(--muted);font-size:13.5px;margin-top:2px}
.alert .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.alert .meta b{color:var(--ink);font-weight:600}
.alert .amt{font:700 17px var(--display);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.alert .amt small{display:block;font:500 11.5px var(--body);color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--sunk);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar .tr i.mute{background:var(--muted);opacity:.55}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:18px;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols .c i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:6px 6px 0 0}
.cols .c i.alt{background:color-mix(in oklab,var(--accent) 45%,var(--panel))}
.cols .c span{font-size:12px;color:var(--muted)} .cols .c b{font-size:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;font-size:12px;min-width:860px}
.cal .h{color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cal .h.we{color:var(--ink);font-weight:700}
.cal .u{font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);position:sticky;left:0;background:var(--panel);z-index:1}
.cal .row{position:relative;border-bottom:1px solid var(--line);height:42px}
.blk{position:absolute;top:6px;height:30px;border-radius:7px;color:#071310;font-size:11.5px;font-weight:600;padding:0 7px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border:0;cursor:pointer;text-align:left}
.gapc{position:absolute;top:6px;height:30px;border-radius:7px;border:1.5px dashed var(--bad);background:var(--bad-soft)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--sunk);border-radius:12px;padding:10px;min-height:120px}
.kcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.card .nm{font-weight:700}
.card .sm{color:var(--muted);font-size:12.5px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink)}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tm{font-size:12.5px;color:var(--muted)}
.chat{display:grid;gap:12px}
.msg{padding:12px 14px;border-radius:12px;max-width:820px;white-space:pre-wrap}
.msg.me{background:var(--accent-soft);justify-self:end}
.msg.ai{background:var(--panel);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 13px;cursor:pointer;font-size:14px;min-height:38px}
.note{font-size:13px;color:var(--muted)}
.drawer{position:fixed;inset:auto 0 0 0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 40px #0003;padding:18px clamp(16px,3vw,32px) calc(22px + env(safe-area-inset-bottom,0px));z-index:30;max-height:70vh;overflow:auto}
.drawer h3{font:700 20px var(--display);margin:0 0 10px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-variant-numeric:tabular-nums}
nav.tabs{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40}
.score{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring b{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 26px var(--display)}
@media (max-width:1050px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  nav.tabs .navbtn{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-width:64px;align-items:center;text-align:center;min-height:52px}
  nav.tabs .navbtn .cnt{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{padding-top:env(safe-area-inset-top,0px)}
#lock{position:fixed;inset:0;background:#000;color:#fff;display:grid;place-items:center;padding:24px;z-index:100}
#lock form{display:grid;gap:14px;width:min(340px,100%);text-align:center}
#lock img{width:min(230px,60vw);height:auto;margin:0 auto 18px;display:block}
#lock input{font:600 18px var(--body);text-align:center;letter-spacing:.12em;text-transform:uppercase;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;min-height:52px}
#lock button{font:700 17px var(--body);padding:14px;border-radius:999px;border:0;background:#fff;color:#000;min-height:52px;cursor:pointer}
#lock .err{color:#f07a70;min-height:20px;font-size:14px}
#lock .small{color:#8a8a8a;font-size:13px}
</style>
</head>
<body>
<div id="lock">
  <form id="unlock" autocomplete="off">
    <img src="onyx-logo-white.png" alt="Onyx Beach Hotel">
    <input id="code" type="password" inputmode="text" placeholder="Passcode" aria-label="Passcode" autocapitalize="characters" spellcheck="false">
    <button type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
    <div class="small">Private hotel data. Asked once per device.</div>
  </form>
</div>
<div id="shell" hidden>


<div class="app">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="drawer" class="drawer" hidden></div>
<div id="toast" class="toast" hidden></div>


</div>
